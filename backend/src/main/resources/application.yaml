server:
  port: ${SERVER_PORT:8085}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        name: JSESSIONID

spring:
  application:
    name: ledger-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:ledger}}
    username: ${POSTGRES_USER:ledger}
    password: ${POSTGRES_PASSWORD:ledger_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
            scope:
              - openid
              - profile
              - email

ledger:
  frontend-url: ${FRONTEND_URL:http://localhost:3001}

  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    base-delay-seconds: ${OUTBOX_BASE_DELAY_SECONDS:2}
    max-delay-seconds: ${OUTBOX_MAX_DELAY_SECONDS:300}

  idempotency:
    ttl-seconds: ${LEDGER_IDEMPOTENCY_TTL_SECONDS:86400}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    signup:
      max-attempts: ${RATE_LIMIT_SIGNUP_MAX_ATTEMPTS:10}
      window-seconds: ${RATE_LIMIT_SIGNUP_WINDOW_SECONDS:60}
    financial:
      max-attempts: ${RATE_LIMIT_FINANCIAL_MAX_ATTEMPTS:${RATE_LIMIT_FINANCIAL_MAX_REQUESTS:100}}
      window-seconds: ${RATE_LIMIT_FINANCIAL_WINDOW_SECONDS:60}
    load-test:
      enabled: ${RATE_LIMIT_LOAD_TEST_ENABLED:false}
      financial:
        max-attempts: ${RATE_LIMIT_LOAD_TEST_FINANCIAL_MAX_ATTEMPTS:1000}
        window-seconds: ${RATE_LIMIT_LOAD_TEST_FINANCIAL_WINDOW_SECONDS:60}

  security:
    admin-emails: ${LEDGER_ADMIN_EMAILS:admin@ledger.com}

    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    db:
      enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId}]"